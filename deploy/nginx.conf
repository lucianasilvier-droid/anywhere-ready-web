# Nginx in front of the Node server (npm start / Docker on port 3000).
# Copy to /etc/nginx/sites-available/google-nfc-connect, adjust server_name and
# paths, enable it, then get HTTPS with: sudo certbot --nginx -d seu-dominio.com.br
#
# The app needs a running Node process (pages are rendered on the server and the
# API lives in the same process), so Nginx proxies to it and serves the static
# build directly for speed.

upstream nfc_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name seu-dominio.com.br www.seu-dominio.com.br;

    # Backups (ZIP) and photos are uploaded through the app.
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/xml image/svg+xml;

    # Hashed build assets: served by Nginx, cached forever.
    # Adjust the path to where the project lives on the server.
    location /assets/ {
        alias /var/www/google-nfc-connect/dist/client/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @app;
    }

    location / {
        proxy_pass http://nfc_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off; # pages are streamed
    }

    location @app {
        proxy_pass http://nfc_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
