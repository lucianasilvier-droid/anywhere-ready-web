name: Validar análise comercial do CRM

on:
  push:
    branches: [fix/analise-comercial-contextual]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
      - name: Instalar dependências travadas
        run: bun install --frozen-lockfile
      - name: Executar testes
        run: bun run test
      - name: Executar lint
        run: bun run lint
      - name: Validar build de produção
        run: bun run build
