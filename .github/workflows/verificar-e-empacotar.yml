name: Verificar e empacotar projeto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
      - name: Instalar dependências travadas
        run: bun install --frozen-lockfile
      - name: Executar testes
        run: bun run test
      - name: Validar build de produção
        run: bun run build
      - name: Criar ZIP do código-fonte
        run: |
          zip -r anywhere-ready-web.zip . \
            -x '.git/*' 'node_modules/*' 'dist/*' '.output/*' '.vinxi/*' '.tanstack/*' \
               '.env' '.env.*' '**/.env' '**/.env.*' '*.log' '*.zip'
      - name: Publicar ZIP e resultado da verificação
        uses: actions/upload-artifact@v4
        with:
          name: anywhere-ready-web-source
          path: anywhere-ready-web.zip
          if-no-files-found: error
          retention-days: 14
