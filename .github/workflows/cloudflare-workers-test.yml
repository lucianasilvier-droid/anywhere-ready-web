name: Cloudflare Workers test build

on:
  push:
    branches:
      - preparacao/cloudflare-workers-teste
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application and Cloudflare build tools
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @cloudflare/vite-plugin wrangler
      - name: Build for Cloudflare Workers
        run: npm run build
      - name: Generate deploy bundle
        run: npx wrangler deploy --dry-run --outdir=worker-build
      - name: Upload build output for deployment
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-workers-build
          path: |
            worker-build/
            dist/client/
            .wrangler/
          if-no-files-found: error
          retention-days: 2
