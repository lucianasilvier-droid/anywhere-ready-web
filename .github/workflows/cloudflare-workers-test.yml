name: Cloudflare Workers test build

on:
  push:
    branches:
      - preparacao/cloudflare-workers-teste
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Add Cloudflare build tools
        run: bun add --dev @cloudflare/vite-plugin wrangler
      - name: Build for Cloudflare Workers
        run: bun run build
      - name: Validate deploy bundle
        run: bunx wrangler deploy --dry-run --outdir=worker-build
      - name: Upload deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-workers-build
          path: |
            worker-build/
            .output/public/
          if-no-files-found: error
          retention-days: 2
