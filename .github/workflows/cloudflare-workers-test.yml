name: Cloudflare Workers test build

on:
  push:
    branches:
      - preparacao/cloudflare-workers-teste
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Add Cloudflare build tools
        run: bun add --dev @cloudflare/vite-plugin wrangler
      - name: Build for Cloudflare Workers
        run: bun run build
      - name: Validate deploy bundle
        run: bunx wrangler deploy --dry-run
      - name: Deploy test Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: fed792a7a64b9916811dfaf01fb48f8b
          command: deploy
      - name: Upload build output for inspection
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-workers-build
          path: |
            .output/
            .wrangler/
          if-no-files-found: error
          retention-days: 2
