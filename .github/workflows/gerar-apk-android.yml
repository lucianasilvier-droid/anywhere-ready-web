name: Gerar APK Android

on:
  push:
    branches:
      - preparar-apk-android-2026-11-10
  workflow_dispatch:
    inputs:
      app_url:
        description: "Endereço público do Google NFC Connect (sem login da Vercel)"
        required: true
        default: "https://google-nfc-connect.vercel.app"
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar ferramentas Capacitor
        run: |
          bun add --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Preparar aplicativo e endereço do sistema
        env:
          APP_URL: ${{ inputs.app_url || 'https://google-nfc-connect.vercel.app' }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          const url = new URL(process.env.APP_URL);
          if (url.protocol !== 'https:') throw new Error('O endereço do sistema precisa usar HTTPS.');
          await mkdir('www', { recursive: true });
          await writeFile('capacitor.config.json', JSON.stringify({
            appId: 'com.googlenfcconnect.app',
            appName: 'Google NFC Connect',
            webDir: 'www',
            server: {
              url: url.toString().replace(/[/]$/, ''),
              cleartext: false,
              allowNavigation: [url.hostname, '*.google.com', '*.google.com.br', '*.googleusercontent.com']
            },
            android: { allowMixedContent: false }
          }, null, 2));
          await writeFile('www/index.html', `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google NFC Connect</title></head><body><p>Conectando ao Google NFC Connect…</p></body></html>`);
          NODE

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Compilar APK instalável
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: google-nfc-connect-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
