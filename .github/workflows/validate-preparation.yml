name: Validate preparation branch

on:
  push:
    branches:
      - preparacao/sites-premium-restaurantes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --no-package-lock
      - name: Lint
        run: npm run lint -- --rule 'prettier/prettier: off'
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
