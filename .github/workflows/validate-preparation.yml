name: Validate preparation branch

on:
  push:
    branches:
      - preparacao/sites-premium-restaurantes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: "bun run lint -- --rule 'prettier/prettier: off'"
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build
