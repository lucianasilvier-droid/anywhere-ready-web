# App + PostgreSQL on one machine (VPS, home server, local test).
#
#   cp .env.example .env      # fill in the values
#   docker compose up -d --build
#   docker compose exec app node scripts/create-admin.mjs voce@empresa.com "SenhaForte123"
#
# The app listens on port 3000; put Nginx/Caddy in front for HTTPS (deploy/nginx.conf).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nfc}
      POSTGRES_USER: ${POSTGRES_USER:-nfc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nfc} -d ${POSTGRES_DB:-nfc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nfc}:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/${POSTGRES_DB:-nfc}
      STORAGE_DIR: /app/storage
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  storage:
